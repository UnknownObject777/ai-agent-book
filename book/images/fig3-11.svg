<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="122.92mm" viewBox="0 0 720 590" role="img" aria-labelledby="title desc">
<title id="title">GraphRAG 实体与关系索引示意</title>
<desc id="desc">用户与父亲关联不同医生；同姓医生通过主体、机构和关系分开，关系附带原始证据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="590" fill="#ffffff"/>
<rect x="25" y="30" width="170" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="110.0" y="66.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用户</text>
<rect x="525" y="30" width="170" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="610.0" y="66.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用户的父亲</text>
<path d="M 195 60 L 525 60" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="45" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">父亲是</text>
<path d="M 110 90 L 110 130 L 160 130 L 160 175" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="175" y="160" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">就诊于</text>
<rect x="25" y="180" width="270" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="160.0" y="218.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">张医生 A（牙科）</text>
<path d="M 160 245 L 160 315" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="175" y="285" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">任职于</text>
<rect x="25" y="320" width="270" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="160.0" y="358.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">甲医院</text>
<path d="M 160 385 L 160 445" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="175" y="422" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">地址</text>
<rect x="25" y="450" width="270" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="160.0" y="486.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">对应地址记录</text>
<path d="M 610 90 L 610 130 L 560 130 L 560 175" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575" y="160" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">就诊于</text>
<rect x="425" y="180" width="270" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="560.0" y="218.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">张医生 B（心脏科）</text>
<path d="M 560 245 L 560 315" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575" y="285" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">任职于</text>
<rect x="425" y="320" width="270" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="560.0" y="358.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">乙医院</text>
<path d="M 560 385 L 560 445" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575" y="422" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">地址</text>
<rect x="425" y="450" width="270" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="560.0" y="486.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">对应地址记录</text>
<text x="360" y="553" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">实体先消歧；每条关系保留来源与有效时间。</text>
</svg>
