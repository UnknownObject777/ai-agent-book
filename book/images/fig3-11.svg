<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="109.17mm" viewBox="0 0 900 655" role="img" aria-labelledby="title desc">
<title id="title">用关系图区分同名人物并逐跳检索</title><desc id="desc">两个张医生有不同实体标识和关系。牙医地址沿用户、医生、医院、地址依次检索。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="655" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="62" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#292929">查询：我的牙医所在医院的地址？</text>
<rect x="340" y="120" width="220" height="60" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="160" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#292929">用户</text>
<path d="M 450 180 L 450 210 L 225 210 L 225 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="325" y="257" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">我的牙医</text>
<rect x="20" y="280" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="225" y="315" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">张医生-A</text>
<text x="225" y="350" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">科室：牙科</text>
<path d="M 225 370 L 225 430" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="290" y="409" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">就职于</text>
<rect x="20" y="430" width="410" height="70" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="225" y="474" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">仁爱口腔医院</text>
<path d="M 450 180 L 450 210 L 675 210 L 675 280" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="775" y="257" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">父亲的心脏科医生</text>
<rect x="470" y="280" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="315" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">张医生-B</text>
<text x="675" y="350" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">科室：心内科</text>
<path d="M 675 370 L 675 430" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="740" y="409" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">就职于</text>
<rect x="470" y="430" width="410" height="70" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="474" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">华山医院 · 心血管中心</text>
<path d="M 225 500 L 225 560" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="285" y="539" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">地址</text>
<rect x="20" y="560" width="410" height="65" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="225" y="602" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#292929">徐汇区 XX 路</text>
</svg>
