<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="155.00mm" viewBox="0 0 900 930" role="img" aria-labelledby="title desc">
<title id="title">混合检索与重排序流水线</title><desc id="desc">同一查询并行进入稠密与稀疏检索，合并候选后通过RRF融合，并可使用跨编码器重排序。图中分数为示例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="930" fill="#ffffff"/>
<rect x="240" y="20" width="420" height="80" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="52" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">用户查询</text>
<text x="450" y="84" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">kitty behavior</text>
<path d="M 450 100 L 450 125 L 225 125 L 225 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 450 125 L 675 125 L 675 150" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="150" width="410" height="380" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="225" y="190" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">稠密检索</text>
<text x="225" y="232" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">语义：kitty ≈ cat / feline</text>
<text x="225" y="270" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">余弦相似度（示例）</text>
<text x="225" y="317" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">doc3：feline habits and cat play</text>
<text x="225" y="346" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#292929">0.87</text>
<text x="225" y="389" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">doc7：cat grooming patterns</text>
<text x="225" y="418" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#292929">0.82</text>
<text x="225" y="461" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">doc1：pet care basics</text>
<text x="225" y="490" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#292929">0.71</text>
<path d="M 225 530 L 225 560 L 450 560" fill="none" stroke="#333333" stroke-width="1.8"/>
<rect x="470" y="150" width="410" height="380" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="190" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">稀疏检索 · BM25</text>
<text x="675" y="232" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">词项：kitty / behavior</text>
<text x="675" y="270" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">BM25 分数（示例）</text>
<text x="675" y="317" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">doc5：kitty litter training</text>
<text x="675" y="346" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#292929">8.4</text>
