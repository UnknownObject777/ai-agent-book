<rect x="120" y="590" width="660" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="624" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">合并去重 → RRF 融合</text>
<text x="450" y="659" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">6 个不同候选 → 按融合排名取前 5 个</text>
<path d="M 450 680 L 450 715" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120" y="715" width="660" height="90" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="750" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">可选：跨编码器重排序</text>
<text x="450" y="785" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">逐对输入“查询 + 候选文本”，重新评分</text>
<path d="M 450 805 L 450 840" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240" y="840" width="420" height="65" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
