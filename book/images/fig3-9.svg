<text x="675" y="461" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">doc2：kitty behavior and health</text>
<text x="675" y="490" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#292929">3.2</text>
<path d="M 675 530 L 675 560 L 450 560" fill="none" stroke="#333333" stroke-width="1.8"/>
