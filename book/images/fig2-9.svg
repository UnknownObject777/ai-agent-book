<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="95.83mm" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
<title id="title">消息列表到输入序列</title>
<desc id="desc">系统与用户消息按模板展开，随后给出助手生成起点。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="460" fill="#ffffff"/>
<text x="160" y="35" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">客户端的消息列表</text>
<text x="525" y="35" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模板展开后的输入顺序</text>
<rect x="25" y="80" width="265" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="157.5" y="110" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">系统消息</text>
<text x="157.5" y="141" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">查询实时数据，注明单位</text>
<rect x="25" y="230" width="265" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="157.5" y="260" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用户消息</text>
<text x="157.5" y="291" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">温哥华现在几点，天气如何？</text>
<rect x="385" y="80" width="310" height="100" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="110" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">系统角色与边界</text>
<text x="540.0" y="141" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">查询实时数据，注明单位</text>
<rect x="385" y="230" width="310" height="100" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="260" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用户角色与边界</text>
<text x="540.0" y="291" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">温哥华现在几点，天气如何？</text>
<path d="M 290 130 L 385 130" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 290 280 L 385 280" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 540 180 L 540 230" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 540 330 L 540 370" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="385" y="375" width="310" height="55" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="408.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">助手回复的生成起点</text>
<text x="160" y="385" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">同一组消息</text>
<text x="160" y="411" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">形成一段连续输入</text>
</svg>
