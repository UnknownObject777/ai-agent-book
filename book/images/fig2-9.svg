<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="91.67mm" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
<title id="title">API 消息与模型输入的对应关系</title><desc id="desc">两条消息经模板序列化，角色和起止标记界定边界，assistant标记后开始生成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="550" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="140" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="56" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">API 消息</text>
<text x="450" y="101" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;你是助手&quot;}</text>
<text x="450" y="139" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;你好&quot;}</text>
<path d="M 450 160 L 450 225" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="595" y="201" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">Chat Template</text>
<rect x="20" y="225" width="860" height="305" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="263" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">模型输入</text>
<rect x="40" y="285" width="240" height="55" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="321" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">&lt;|im_start|&gt;system</text>
<rect x="305" y="285" width="290" height="55" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="321" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#292929">你是助手</text>
<rect x="620" y="285" width="240" height="55" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="740" y="321" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">&lt;|im_end|&gt;</text>
<path d="M 280 312 L 305 312" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 595 312 L 620 312" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="370" width="240" height="55" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="406" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">&lt;|im_start|&gt;user</text>
<rect x="305" y="370" width="290" height="55" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="406" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#292929">你好</text>
<rect x="620" y="370" width="240" height="55" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="740" y="406" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">&lt;|im_end|&gt;</text>
<path d="M 280 397 L 305 397" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 595 397 L 620 397" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="265" y="491" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">&lt;|im_start|&gt;assistant</text>
<path d="M 430 484 L 525 484" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="665" y="491" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">从此处开始生成</text>
</svg>
