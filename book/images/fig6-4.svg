<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="126.67mm" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">实验 6-2 异步 Agent 打断与恢复</title><desc id="desc">三项真实子进程任务的进度、取消与结果汇总。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="760" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">运行时启动三个后台任务</text>
<text x="450.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">返回 task_id，保存 pending 状态</text>
<path d="M 150 120 L 150 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="160" width="260" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="150.0" y="193" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">任务 A</text>
<text x="150.0" y="240" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">每个 tick 增长 3%</text>
<text x="150.0" y="272" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">最先完成</text>
<path d="M 450 120 L 450 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320" y="160" width="260" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="320" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="193" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">任务 B</text>
<text x="450.0" y="240" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">每个 tick 增长 2%</text>
<text x="450.0" y="272" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">A 完成时约 66%</text>
<path d="M 750 120 L 750 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620" y="160" width="260" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="620" y="160" width="260" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="750.0" y="193" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">任务 C</text>
<text x="750.0" y="240" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">每个 tick 增长 1%</text>
<text x="750.0" y="272" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">A 完成时约 33%</text>
<path d="M 150 315 L 150 355" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="355" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="355" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="388" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">接收 A 完成事件 → 查询 B、C 进度</text>
<text x="450.0" y="435" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">B &gt; 50%：继续运行</text>
<text x="450.0" y="467" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">C ≤ 50%：cancel_tool(task_id) → 确认进程终止</text>
<path d="M 450 500 L 450 540" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="540" width="860" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="540" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="573" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">收集最终状态并生成报告</text>
<text x="450.0" y="620" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">A：完成结果 · B：完成结果 · C：取消记录</text>
<text x="450.0" y="652" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">完成事件与原始任务标识关联；每项终态进入记录</text>
</svg>
