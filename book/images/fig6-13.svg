<text x="450.0" y="590" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">[1] &lt;input type=&quot;text&quot; placeholder=&quot;Search&quot;</text>
<text x="450.0" y="622" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">      aria-label=&quot;Search&quot; /&gt;</text>
<text x="450.0" y="654" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">[2] &lt;button id=&quot;submit-btn&quot; aria-label=&quot;Submit form&quot; /&gt;</text>
<text x="450.0" y="686" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">[3] &lt;input type=&quot;text&quot; placeholder=&quot;Enter your name&quot; value=&quot;&quot; /&gt;</text>
<text x="450.0" y="718" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">[4] &lt;a href=&quot;/docs&quot; aria-label=&quot;Documentation&quot; /&gt;</text>
<path d="M 450 775 L 450 815" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="815" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="815" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="848" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">选择与执行</text>
<text x="450.0" y="895" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">模型选择 [2] → 解析元素引用或坐标</text>
<text x="450.0" y="927" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">检查可见与可交互 → 点击 Submit → 获取新状态</text>
<path d="M 450 965 L 450 1000" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="1000" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="1000" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="1033" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">映射更新</text>
<text x="450.0" y="1080" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">刷新、滚动或动态插入 → 更新候选与编号</text>
<text x="450.0" y="1112" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">缺少结构化信息 → 结合视觉标注或坐标预测</text>
</svg>
