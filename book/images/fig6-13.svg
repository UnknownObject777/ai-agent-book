<text x="330" y="415" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">[3] Enter your name…</text>
<text x="735" y="410" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">[4] Docs →</text>
<rect x="20" y="510" width="860" height="265" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="510" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
