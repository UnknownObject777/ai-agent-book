<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="69.79mm" viewBox="0 0 720 335" role="img" aria-labelledby="title desc">
<title id="title">聊天模板的消息结构</title>
<desc id="desc">用边界、角色、正文展示消息编码方式，具体标记由模型模板规定。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="335" fill="#ffffff"/>
<text x="360" y="35" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#292929">一条消息在模型输入中的结构示意</text>
<rect x="25" y="85" width="125" height="100" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="87.5" y="115" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">起始边界</text>
<text x="87.5" y="146" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">新消息开始</text>
<rect x="165" y="85" width="125" height="100" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="227.5" y="115" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">角色</text>
<text x="227.5" y="146" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">内容来源</text>
<rect x="305" y="85" width="250" height="100" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="430.0" y="115" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">正文</text>
<text x="430.0" y="146" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">消息内容对应的 token</text>
<rect x="570" y="85" width="125" height="100" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="632.5" y="115" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">结束边界</text>
<text x="632.5" y="146" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">当前消息结束</text>
<path d="M 25 225 L 695 225" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="260" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">按模板顺序展开，再转换为模型处理的 token 序列。</text>
<text x="360" y="306" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">图中展示功能位置；实际边界标记采用模型配套模板。</text>
</svg>
