<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="118.75mm" viewBox="0 0 720 570" role="img" aria-labelledby="title desc">
<title id="title">Agent 状态栏架构</title>
<desc id="desc">可信记录形成状态摘要，模型据此决策，执行层用真实计数检查调用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="570" fill="#ffffff"/>
<rect x="25" y="30" width="200" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="125.0" y="66.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">通话与工具记录</text>
<path d="M 125 90 L 125 120 L 360 120" fill="none" stroke="#292929" stroke-width="1.8"/>
<rect x="260" y="30" width="200" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="66.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">任务进度</text>
<path d="M 360 90 L 360 120 L 360 120" fill="none" stroke="#292929" stroke-width="1.8"/>
<rect x="495" y="30" width="200" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="595.0" y="66.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">当前环境</text>
<path d="M 595 90 L 595 120 L 360 120" fill="none" stroke="#292929" stroke-width="1.8"/>
<path d="M 360 120 L 360 155" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100" y="160" width="520" height="100" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="190" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Harness 汇总最新状态</text>
<text x="360.0" y="221" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">三次通话已完成；退款待到账核实</text>
<path d="M 230 260 L 170 310 L 170 345" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 490 260 L 550 310 L 550 345" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25" y="350" width="285" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="167.5" y="380" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型选择下一步</text>
<text x="167.5" y="411" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">等待、查询进展或联系用户</text>
<rect x="410" y="350" width="285" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="552.5" y="380" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">执行层检查</text>
<text x="552.5" y="411" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">按身份、次数与业务规则校验</text>
<path d="M 310 400 L 410 400" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="382" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">请求</text>
<text x="360" y="497" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">状态摘要提供决策依据；执行检查落实操作限制。</text>
<text x="360" y="537" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">新执行结果进入记录，再更新下一轮状态。</text>
</svg>
