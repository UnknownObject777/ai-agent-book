<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="144.17mm" viewBox="0 0 900 865" role="img" aria-labelledby="title desc">
<title id="title">Elo 评分与配对比较排名</title><desc id="desc">匿名候选、预期得分与在线更新数值示例。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="865" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">任务与已知条件</text>
<text x="450.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">退款 $150 已提交，预计 3～5 个工作日原路退回</text>
<rect x="20" y="160" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="160" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="225.0" y="193" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">候选 A</text>
<text x="225.0" y="240" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">$150 退款已提交，预计</text>
<text x="225.0" y="272" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">3～5 个工作日原路到账。</text>
<rect x="470" y="160" width="410" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="470" y="160" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675.0" y="193" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">候选 B</text>
<text x="675.0" y="240" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">好的，退款会处理的。</text>
<path d="M 450 300 L 450 345" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="345" width="860" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="345" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="378" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">匿名判断：A 更符合当前任务</text>
<text x="450.0" y="425" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">交换位置后再次比较；冲突结果单独标记</text>
<path d="M 450 450 L 450 490" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="490" width="860" height="175" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="490" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="523" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">在线 Elo 更新</text>
<text x="450.0" y="570" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">E_A = 1 / (1 + 10^((R_B − R_A) / 400))</text>
<text x="450.0" y="602" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">R_A′ = R_A + K × (S_A − E_A)</text>
<text x="450.0" y="634" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">胜 / 平 / 负：S_A = 1 / 0.5 / 0</text>
<rect x="20" y="700" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="700" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="733" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">数值示例</text>
<text x="450.0" y="780" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">A = 1200，B = 1000：E_A ≈ 0.760</text>
<text x="450.0" y="812" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">K = 20，A 获胜：A′ ≈ 1204.8，B′ ≈ 995.2</text>
</svg>
