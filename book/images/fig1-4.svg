<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="145.83mm" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
<title id="title">三笔收入的简化轨迹</title>
<desc id="desc">每次调用都带上稳定前缀和截至当前的消息。三笔收入示例包含三次模型调用、三次工具调用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="700" fill="#ffffff"/>
<rect x="25" y="20" width="670" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="58.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">每次调用：稳定前缀 + 截至当前的轨迹消息</text>
<text x="185" y="122" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型本轮看到的信息</text>
<text x="535" y="122" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型输出与实际执行</text>
<rect x="25" y="145" width="320" height="137" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="185.0" y="175" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">第 1 次调用</text>
<text x="185.0" y="206" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">任务：三笔收入汇总</text>
<text x="185.0" y="231" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">250 万美元、210 万欧元</text>
<text x="185.0" y="256" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">180 万英镑</text>
<path d="M 345 211 L 375 211" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380" y="145" width="315" height="137" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="537.5" y="175" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">请求两次换汇</text>
<text x="537.5" y="206" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">Harness 调度换汇工具</text>
<text x="537.5" y="231" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">结果写入两条工具消息</text>
<path d="M 535 282 L 535 302 L 185 302 L 185 320" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25" y="320" width="320" height="137" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="185.0" y="350" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">第 2 次调用</text>
<text x="185.0" y="381" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">此前消息 + 两条换汇结果</text>
<text x="185.0" y="406" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">欧元折合 2,282,608.70 美元</text>
<text x="185.0" y="431" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">英镑折合 2,278,481.01 美元</text>
<path d="M 345 386 L 375 386" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380" y="320" width="315" height="137" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="537.5" y="350" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">请求一次代码计算</text>
<text x="537.5" y="381" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">Harness 调度代码工具</text>
<text x="537.5" y="406" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">计算总额与平均值</text>
<path d="M 535 457 L 535 477 L 185 477 L 185 495" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25" y="495" width="320" height="137" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="185.0" y="525" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">第 3 次调用</text>
<text x="185.0" y="556" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">此前消息 + 计算结果</text>
<text x="185.0" y="581" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">总额 7,061,089.71 美元</text>
<text x="185.0" y="606" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">平均 2,353,696.57 美元</text>
<path d="M 345 561 L 375 561" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380" y="495" width="315" height="137" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="537.5" y="525" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">返回最终答案</text>
<text x="537.5" y="556" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">总额 7,061,089.71 美元</text>
<text x="537.5" y="581" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">平均 2,353,696.57 美元</text>
<text x="360" y="677" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">共 3 次模型调用、3 次工具调用；连线表示消息进入下一轮。</text>
</svg>
