<text x="660" y="857" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">BTC/USD 日线数据与来源</text>
<text x="660" y="887" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">返回相关资料</text>
<rect x="480" y="930" width="360" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="660" y="965" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">code_interpreter</text>
<text x="660" y="1002" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">价格序列 → 均线、RSI、MACD</text>
<text x="660" y="1032" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">区间收益 · 最大回撤</text>
<text x="660" y="1062" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">计算结果 · 沙盒内生成图表</text>
