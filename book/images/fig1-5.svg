<rect x="500" y="445" width="170" height="63" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="585.0" y="482.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">托管工具</text>
<path d="M 170 390 L 280 390" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 280 422 L 170 422" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
