<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="206.67mm" viewBox="0 0 900 1240" role="img" aria-labelledby="title desc">
<title id="title">模型主导的工具调用：客户端循环与服务端托管循环</title><desc id="desc">Kimi 搜索由客户端组织循环；托管搜索与代码执行由服务端组织循环。保留任务、查询、返回结果与分析步骤。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="1240" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="70" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="62" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">后训练（包括强化学习）→ 模型的工具调用策略</text>
<rect x="20" y="115" width="860" height="410" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="153" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#292929">实验 1-2：客户端组织搜索循环</text>
<rect x="40" y="180" width="240" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="211" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">客户端 Harness</text>
<text x="160" y="245" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">任务：核查成员资格</text>
<text x="160" y="275" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">与首都状态</text>
<rect x="330" y="180" width="240" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="211" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">Kimi K3</text>
<text x="450" y="245" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">查询决策</text>
<text x="450" y="275" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">补查缺失证据</text>
<rect x="620" y="180" width="240" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="740" y="211" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">Formula 服务</text>
<text x="740" y="245" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">web_search</text>
<text x="740" y="275" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">执行搜索</text>
<path d="M 280 210 L 330 210" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 160 290 L 160 500" fill="none" stroke="#333333" stroke-width="1.8"/>
<path d="M 450 290 L 450 340" fill="none" stroke="#333333" stroke-width="1.8"/>
<path d="M 740 290 L 740 500" fill="none" stroke="#333333" stroke-width="1.8"/>
<path d="M 450 330 L 160 330" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="305" y="320" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">调用请求</text>
<path d="M 160 390 L 740 390" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="378" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">客户端调度：查询成员名单、法规与总统令</text>
<path d="M 740 465 L 160 465" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="451" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">返回搜索结果 → 追加上下文 → 再次调用模型</text>
<rect x="20" y="550" width="860" height="665" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="590" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#292929">实验 1-3：服务端托管搜索与计算循环</text>
<rect x="40" y="615" width="820" height="85" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="648" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">客户端：提交任务与用户补充信息</text>
<text x="450" y="681" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">BTC/USD 日线；MA7、MA20、RSI14、MACD(12,26,9)</text>
<path d="M 450 700 L 450 725" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="725" width="820" height="370" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="759" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">模型服务：Harness 调度模型与托管工具</text>
<rect x="60" y="785" width="260" height="285" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="190" y="821" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">qwen3.7-plus</text>
<text x="190" y="861" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">读取任务与结果</text>
<text x="190" y="891" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">选择搜索或代码执行</text>
<text x="190" y="921" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">检查并调整下一步</text>
<rect x="480" y="785" width="360" height="115" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
