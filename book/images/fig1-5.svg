<text x="450" y="1160" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">客户端接收：分析报告 + 执行日志</text>
