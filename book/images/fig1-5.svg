<rect x="305" y="375" width="155" height="120" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="382.5" y="405" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">托管 Harness</text>
<text x="382.5" y="436" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">维护调用循环</text>
<text x="382.5" y="461" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">回传工具结果</text>
<rect x="500" y="368" width="170" height="55" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
