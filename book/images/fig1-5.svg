<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="116.67mm" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">客户端循环与服务端托管循环</title>
<desc id="desc">两种方式都由模型决定调用。区别在于谁负责循环；工具执行和模型推理是不同职责。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="560" fill="#ffffff"/>
<text x="360" y="25" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#292929">实验 1-2：客户端组织循环</text>
<text x="360" y="290" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#292929">实验 1-3：服务端组织循环</text>
<rect x="25" y="100" width="185" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="117.5" y="130" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">客户端 Harness</text>
<text x="117.5" y="161" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">请求模型</text>
<text x="117.5" y="186" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">调度工具并回传结果</text>
<rect x="320" y="55" width="375" height="190" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="507" y="85" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Moonshot 服务端</text>
<rect x="350" y="100" width="315" height="52" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="507.5" y="132.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Kimi K3：生成调用请求</text>
<rect x="350" y="174" width="315" height="52" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="507.5" y="206.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Formula：执行搜索</text>
<path d="M 210 115 L 350 115" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 140 L 210 140" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="265" y="98" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">请求／决策</text>
<path d="M 210 175 L 350 190" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 350 215 L 210 199" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="265" y="238" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">调用／结果</text>
<rect x="25" y="355" width="145" height="120" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="97.5" y="385" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">客户端</text>
<text x="97.5" y="416" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">提交任务</text>
<text x="97.5" y="441" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">接收回答</text>
