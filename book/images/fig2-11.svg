<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="108.33mm" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Skills 渐进式披露</title>
<desc id="desc">先查看目录，选中演示文稿能力后加载核心流程，再按步骤读取资料。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="520" fill="#ffffff"/>
<text x="360" y="35" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">目录：先知道有哪些能力</text>
<rect x="25" y="60" width="200" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="125.0" y="98.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">文档处理</text>
<rect x="260" y="60" width="200" height="65" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="98.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">演示文稿</text>
<rect x="495" y="60" width="200" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="595.0" y="98.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">表格分析</text>
<path d="M 360 125 L 360 190" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380" y="163" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">任务需要制作演示文稿</text>
<rect x="110" y="195" width="500" height="95" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="225" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">加载核心流程</text>
<text x="360.0" y="256" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">阅读论文 → 安排页面 → 制作 → 检查</text>
<path d="M 360 290 L 360 330" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="358" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">执行到具体步骤，再读取相关资料</text>
<rect x="25" y="390" width="200" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="125.0" y="426.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">图表规范</text>
<rect x="260" y="390" width="200" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="426.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">文件格式说明</text>
<rect x="495" y="390" width="200" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="595.0" y="426.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">预览与检查方法</text>
<text x="360" y="495" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">目录用于选择；核心流程指导推进；参考资料补充细节。</text>
