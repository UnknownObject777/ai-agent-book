<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="72.92mm" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
<title id="title">Agent 的三类功能</title>
<desc id="desc">三行分别表示模型、上下文和工具的功能；不表示三个独立的软件模块。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="350" fill="#ffffff"/>
<rect x="30" y="30" width="220" height="80" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="140.0" y="60" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">LLM</text>
<text x="140.0" y="91" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">大脑</text>
<rect x="275" y="30" width="415" height="80" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="482" y="76" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#292929">理解任务，规划并选择下一步</text>
<rect x="30" y="130" width="220" height="80" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="140.0" y="160" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">上下文</text>
<text x="140.0" y="191" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">当前决策视野</text>
<rect x="275" y="130" width="415" height="80" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="482" y="176" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#292929">承载指令、观测、历史和任务状态</text>
<rect x="30" y="230" width="220" height="80" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="140.0" y="260" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">工具</text>
<text x="140.0" y="291" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">感官和手脚</text>
<rect x="275" y="230" width="415" height="80" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="482" y="276" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#292929">获取外部信息，或执行实际操作</text>
</svg>
