<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="130.00mm" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
<title id="title">两次模型 API 调用的完整交互序列</title><desc id="desc">温哥华时间与天气：模型产生两项独立调用，Harness执行并回传带ID的结果，模型再生成最终回答。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="780" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="56" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#292929">第一次模型调用</text>
<text x="450" y="93" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">messages：system + user    tools：时间工具 + 天气工具</text>
<path d="M 450 120 L 450 157" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="157" width="860" height="145" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="193" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">assistant：tool_calls</text>
<text x="450" y="235" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">call_abc123 → get_current_time(timezone=&quot;America/Vancouver&quot;)</text>
<text x="450" y="276" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">call_def456 → get_weather(city=&quot;Vancouver&quot;, unit=&quot;celsius&quot;)</text>
<path d="M 450 302 L 450 325 L 230 325 L 230 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 450 325 L 670 325 L 670 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="360" width="420" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="230" y="394" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">时间工具</text>
<text x="230" y="431" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">call_abc123</text>
<text x="230" y="466" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">返回温哥华当前时间</text>
<rect x="460" y="360" width="420" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="670" y="394" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">天气工具</text>
<text x="670" y="431" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">call_def456</text>
<text x="670" y="466" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">返回气温与天气状况</text>
<text x="450" y="348" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">独立调用 · Harness 并行调度</text>
<path d="M 230 485 L 230 516 L 450 516" fill="none" stroke="#333333" stroke-width="1.8"/>
<path d="M 670 485 L 670 516 L 450 516 L 450 550" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="550" width="860" height="100" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="585" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#292929">第二次模型调用 · tools 保持不变</text>
<text x="450" y="625" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">原有 messages + assistant 调用消息 + 两条带 tool_call_id 的结果</text>
<path d="M 450 650 L 450 683" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="683" width="860" height="77" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="714" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">assistant：最终回复（结束循环）</text>
<text x="450" y="747" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">“温哥华现在是……，天气……”</text>
</svg>
