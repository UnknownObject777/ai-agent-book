<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="137.50mm" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
<title id="title">两轮模型调用与两次工具执行</title>
<desc id="desc">客户端维护历史，模型选择调用，两项查询独立执行后回传结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="660" fill="#ffffff"/>
<rect x="20" y="20" width="170" height="56" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="105.0" y="54.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Harness</text>
<path d="M 105 76 L 105 590" fill="none" stroke="#292929" stroke-width="1.8" stroke-dasharray="6 5"/>
<rect x="270" y="20" width="170" height="56" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="355.0" y="54.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型服务</text>
<path d="M 355 76 L 355 590" fill="none" stroke="#292929" stroke-width="1.8" stroke-dasharray="6 5"/>
<rect x="520" y="20" width="170" height="56" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="605.0" y="54.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">查询工具</text>
<path d="M 605 76 L 605 590" fill="none" stroke="#292929" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="225" y="117" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">任务、规则与工具定义</text>
<path d="M 105 135 L 355 135" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225" y="180" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">请求查询时间与天气</text>
<path d="M 355 198 L 105 198" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="185" y="233" width="340" height="27" fill="white"/>
<text x="355" y="254" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">校验参数后，并行执行两项查询</text>
<path d="M 105 273 L 605 273" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="505" y="298" width="190" height="84" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="600.0" y="328" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">执行查询</text>
<text x="600.0" y="359" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">当地时间 · 当前天气</text>
<rect x="185" y="388" width="340" height="27" fill="white"/>
<text x="355" y="409" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">两条工具结果，分别关联原请求</text>
<path d="M 605 427 L 105 427" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225" y="478" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">原有消息 + 工具结果</text>
<path d="M 105 497 L 355 497" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225" y="542" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">根据结果回答用户</text>
<path d="M 355 560 L 105 560" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="625" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">模型调用 2 轮；工具执行 2 次。时间沿竖直方向推进。</text>
</svg>
