<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="171.67mm" viewBox="0 0 900 1030" role="img" aria-labelledby="title desc">
<title id="title">动态发现后的上下文结构：工具 schema 散落在轨迹各处</title><desc id="desc">以股价查询和GitHub贡献者分析展示两轮工具发现。新增定义随tool_search_output进入历史，并在后续请求中保留位置。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="1030" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="160" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="55" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">稳定前缀</text>
<text x="450" y="93" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">System Prompt</text>
<text x="450" y="129" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">核心工具：web_search、code_interpreter</text>
<text x="450" y="162" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">工具搜索：tool_search</text>
