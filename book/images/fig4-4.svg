<text x="450" y="984" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">下一轮：在现有历史末尾追加消息</text>
</svg>
