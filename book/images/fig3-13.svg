<text x="360" y="241" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Harness</text>
<text x="360" y="276" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">组织上下文 · 检查调用 · 约束预算</text>
