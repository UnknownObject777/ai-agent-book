<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="88.54mm" viewBox="0 0 720 425" role="img" aria-labelledby="title desc">
<title id="title">单轮请求与响应</title>
<desc id="desc">Harness 提交系统规则与用户问题，模型生成回答，Harness 保存回答。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="425" fill="#ffffff"/>
<rect x="25" y="25" width="250" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="150.0" y="61.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">客户端 Harness</text>
<rect x="445" y="25" width="250" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="570.0" y="61.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型服务</text>
<path d="M 150 85 L 150 345" fill="none" stroke="#292929" stroke-width="1.8" stroke-dasharray="6 5"/>
<path d="M 570 85 L 570 345" fill="none" stroke="#292929" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="360" y="137" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">系统规则 + 用户问题</text>
<path d="M 150 157 L 570 157" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="188" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">“你能帮我做什么？”</text>
<text x="360" y="248" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型回复</text>
<path d="M 570 269 L 150 269" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="300" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">根据系统规则介绍可提供的帮助</text>
<rect x="25" y="345" width="670" height="58" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="380.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Harness 将回答写入历史，供后续调用使用</text>
</svg>
