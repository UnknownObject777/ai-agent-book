<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="53.33mm" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
<title id="title">单轮 API 调用的请求与响应结构</title><desc id="desc">Harness发送系统指令与用户问题，模型返回assistant消息。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="320" fill="#ffffff"/>
<rect x="20" y="20" width="360" height="280" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="200" y="60" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">请求 · Harness 构造</text>
<rect x="40" y="85" width="320" height="85" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
