<text x="200" y="150" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">助手身份与回答规则</text>
<rect x="40" y="190" width="320" height="85" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="200" y="222" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">user</text>
<text x="200" y="255" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">Hello, who are you?</text>
<path d="M 380 160 L 520 160" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="143" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">模型 API</text>
<rect x="520" y="20" width="360" height="280" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="700" y="60" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">响应 · 模型生成</text>
<rect x="540" y="100" width="320" height="160" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="700" y="142" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">assistant</text>
<text x="700" y="192" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">Hi! I’m a coding assistant…</text>
