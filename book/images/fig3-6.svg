<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="150.00mm" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">稠密嵌入技术演进</title><desc id="desc">从静态词向量、上下文词元表示，到面向相似度计算的句向量及多种检索表示。维度采用图内指定配置。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="900" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="20" width="220" height="140" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="130" y="63" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">2013</text>
<text x="130" y="110" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">Word2Vec</text>
<text x="440" y="77" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">局部窗口中的词汇共现</text>
<text x="440" y="107" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">预测上下文或中心词</text>
<path d="M 640 40 L 640 140" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="761" y="77" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">静态词向量</text>
<text x="761" y="107" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">示例配置：300 维</text>
<path d="M 450 160 L 450 195" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="195" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="195" width="220" height="140" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="130" y="238" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">2014</text>
<text x="130" y="285" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">GloVe</text>
<text x="440" y="252" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">全局词共现统计</text>
<text x="440" y="282" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">加权最小二乘目标</text>
<path d="M 640 215 L 640 315" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="761" y="252" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">静态词向量</text>
<text x="761" y="282" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">示例配置：300 维</text>
<path d="M 450 335 L 450 370" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="370" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="370" width="220" height="140" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="130" y="413" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">2018</text>
<text x="130" y="460" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">BERT</text>
<text x="440" y="427" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">Transformer · 掩码语言模型</text>
<text x="440" y="457" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">词元表示随所在上下文变化</text>
<path d="M 640 390 L 640 490" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="761" y="427" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">上下文词元表示</text>
<text x="761" y="457" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">BERT-base：768 维</text>
<path d="M 450 510 L 450 545" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="545" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="545" width="220" height="140" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="130" y="588" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">2019</text>
<text x="130" y="635" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">Sentence-BERT</text>
<text x="440" y="602" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">孪生 / 三元组网络 · 池化</text>
<text x="440" y="632" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">句向量可用余弦比较</text>
<path d="M 640 565 L 640 665" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="761" y="602" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">句子表示</text>
<text x="761" y="632" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">base 版本：768 维</text>
<path d="M 450 685 L 450 720" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="720" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="720" width="220" height="140" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="130" y="763" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">2024</text>
<text x="130" y="810" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">BGE-M3</text>
<text x="440" y="777" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">多语言 · 最长 8192 token</text>
<text x="440" y="807" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">稠密 / 稀疏 / 多向量检索</text>
<path d="M 640 740 L 640 840" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="761" y="777" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">稠密表示</text>
<text x="761" y="807" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">1024 维</text>
</svg>
