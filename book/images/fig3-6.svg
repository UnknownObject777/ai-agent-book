<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="127.08mm" viewBox="0 0 720 610" role="img" aria-labelledby="title desc">
<title id="title">从静态词向量到上下文检索表示</title>
<desc id="desc">同一词的固定表示、结合句子的表示与面向检索的整段表示各自承担不同任务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="610" fill="#ffffff"/>
<rect x="25" y="20" width="670" height="75" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="50" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">同一个词：苹果</text>
<text x="360.0" y="81" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">苹果公司发布产品 ／ 买了两斤苹果</text>
<rect x="25" y="130" width="195" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="122.5" y="186.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">静态词向量</text>
<path d="M 220 180 L 265 180" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="270" y="130" width="425" height="100" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="482.5" y="160" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">按词查找固定表示</text>
<text x="482.5" y="191" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">两处“苹果”取得同一词向量</text>
<rect x="25" y="275" width="195" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="122.5" y="331.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">上下文词表示</text>
<path d="M 220 325 L 265 325" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="270" y="275" width="425" height="100" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="482.5" y="305" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">结合所在句子计算</text>
<text x="482.5" y="336" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">两处“苹果”形成不同表示</text>
<rect x="25" y="420" width="195" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="122.5" y="476.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">检索向量</text>
<path d="M 220 470 L 265 470" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="270" y="420" width="425" height="100" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="482.5" y="450" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">编码查询与文档片段</text>
<text x="482.5" y="481" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">通过配套表示寻找相关材料</text>
<text x="360" y="588" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">表示方式服务于任务，检索效果通过相关材料检验。</text>
</svg>
