<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="141.67mm" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">六种压缩策略的处理流程</title><desc id="desc">六种策略保留各自的材料组织、任务上下文、来源链接和窗口阈值处理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="850" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="54" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">① 无压缩</text>
<text x="605" y="54" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">直接保留</text>
<rect x="40" y="72" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="222" y="105" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">原始搜索结果</text>
<path d="M 405 97 L 490 97" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490" y="72" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="105" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">完整结果</text>
<rect x="20" y="157" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="191" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">② 个体摘要</text>
<text x="605" y="191" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">分别生成 2–3 段摘要</text>
<rect x="40" y="209" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="222" y="242" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">各页面内容</text>
<path d="M 405 234 L 490 234" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490" y="209" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="242" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">逐页摘要</text>
<rect x="20" y="294" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="328" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">③ 组合摘要</text>
<text x="605" y="328" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">合并、去重与摘要</text>
<rect x="40" y="346" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="222" y="379" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">一批搜索结果</text>
<path d="M 405 371 L 490 371" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490" y="346" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="379" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">综合摘要</text>
<rect x="20" y="431" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="465" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">④ 上下文感知</text>
<text x="605" y="465" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">按任务提取</text>
<rect x="40" y="483" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="222" y="516" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">搜索结果 + 查询 + 已知信息</text>
<path d="M 405 508 L 490 508" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490" y="483" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="516" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">相关事实与缺口</text>
<rect x="20" y="568" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="602" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">⑤ 感知 + 引用</text>
<text x="605" y="602" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">摘要并保留 URL</text>
<rect x="40" y="620" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="222" y="653" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">搜索结果 + 查询 + 已知信息</text>
<path d="M 405 645 L 490 645" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490" y="620" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="653" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">事实与来源</text>
<rect x="20" y="705" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="739" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">⑥ 自适应窗口</text>
<text x="605" y="739" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">≤80% 保留；&gt;80% 批量摘要</text>
<rect x="40" y="757" width="365" height="50" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="222" y="790" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">当前输入占用</text>
<path d="M 405 782 L 490 782" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="490" y="757" width="370" height="50" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="790" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">标记已压缩结果</text>
</svg>
