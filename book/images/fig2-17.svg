<text x="360" y="614" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">材料组织、摘要目标、来源追溯与整理时机可以组合。</text>
