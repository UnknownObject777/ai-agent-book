<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="115.62mm" viewBox="0 0 720 555" role="img" aria-labelledby="title desc">
<title id="title">本地模型与客户端工具循环</title>
<desc id="desc">模型通过本地服务返回请求，客户端执行工具并把结果加入下一轮上下文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="555" fill="#ffffff"/>
<rect x="25" y="190" width="260" height="145" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="155.0" y="220" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">客户端 Harness</text>
<text x="155.0" y="251" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">组织消息，校验参数</text>
<text x="155.0" y="276" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">执行工具，保存结果</text>
<text x="155.0" y="301" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">决定继续或结束</text>
<rect x="455" y="40" width="240" height="120" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="575.0" y="70" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">本地模型服务</text>
<text x="575.0" y="101" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">Ollama 或 vLLM</text>
<text x="575.0" y="126" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">加载模型并生成响应</text>
<rect x="455" y="360" width="240" height="120" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="575.0" y="390" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">工具与外部数据</text>
<text x="575.0" y="421" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">时区数据</text>
<text x="575.0" y="446" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">天气服务</text>
<path d="M 285 221 L 370 221 L 370 95 L 455 95" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="73" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">上下文</text>
<path d="M 455 135 L 405 135 L 405 261 L 285 261" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="495" y="199" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">工具请求或回答</text>
<path d="M 285 292 L 370 292 L 370 403 L 455 403" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="318" y="375" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">调用</text>
<path d="M 455 445 L 150 445 L 150 335" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="290" y="430" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">执行结果</text>
<text x="360" y="528" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">客户端将工具结果写入历史，再调用本地模型。</text>
</svg>
