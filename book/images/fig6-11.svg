<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="120.00mm" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
<title id="title">Computer Use Agent 的感知-思考-行动循环</title><desc id="desc">截图、动作决策、执行及新观测回流。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="720" fill="#ffffff"/>
<rect x="65" y="20" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="65" y="20" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">① 获取观测</text>
<text x="450.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">桌面 / 浏览器 / 应用截图</text>
<text x="450.0" y="132" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">记录画面尺寸与界面状态</text>
<path d="M 450 155 L 450 190" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65" y="190" width="770" height="135" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="65" y="190" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="223" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">② 模型决策</text>
<text x="450.0" y="270" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">输入：截图 + 任务 + 历史与当前状态</text>
<text x="450.0" y="302" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">输出示例：click(512, 250)，再输入 weather</text>
<path d="M 450 325 L 450 360" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65" y="360" width="770" height="170" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="65" y="360" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="393" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">③ 执行动作</text>
<text x="450.0" y="440" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">工具层校验与调度 → xdotool / Playwright</text>
<text x="450.0" y="472" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">鼠标：移动、点击、拖拽 · 键盘：输入、组合键</text>
<text x="450.0" y="504" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">滚动：改变视口 · 等待：接收界面响应</text>
<path d="M 450 530 L 450 565" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65" y="565" width="770" height="100" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="65" y="565" width="770" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="598" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">④ 读取动作后的状态</text>
<text x="450.0" y="645" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">界面变化 → 获取新截图 → 检查目标是否达成</text>
<path d="M 65 615 L 25 615 L 25 85 L 65 85" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
