<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="132.29mm" viewBox="0 0 720 635" role="img" aria-labelledby="title desc">
<title id="title">自主 Agent 的执行循环</title>
<desc id="desc">先判断响应类型，再执行工具或返回回复；最终输出工具在工具执行后结束，不能走无调用分支。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="635" fill="#ffffff"/>
<rect x="40" y="25" width="435" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="257.5" y="63.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">组织上下文，调用模型</text>
<rect x="40" y="135" width="435" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="257.5" y="173.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">检查本轮响应与运行状态</text>
<path d="M 257 90 L 257 135" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 475 166 L 540 166" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540" y="118" width="155" height="103" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="617.5" y="148" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">回复或暂停</text>
<text x="617.5" y="179" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">无工具调用</text>
<text x="617.5" y="204" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">或需用户补充</text>
<path d="M 257 200 L 257 265" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270" y="239" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">有工具调用</text>
<rect x="40" y="265" width="435" height="82" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="257.5" y="295" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Harness 校验并调度</text>
<text x="257.5" y="326" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">工具执行，结果写回轨迹</text>
<path d="M 257 347 L 257 400" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40" y="400" width="435" height="80" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="257.5" y="430" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">检查完成条件与运行预算</text>
<text x="257.5" y="461" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">完成验证；最终输出工具；轮数或错误上限</text>
<path d="M 475 440 L 540 440" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540" y="395" width="155" height="96" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="617.5" y="425" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">结束或升级</text>
<text x="617.5" y="456" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">返回结果</text>
<text x="617.5" y="481" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">报告错误／转人工</text>
<text x="507" y="421" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">满足</text>
<path d="M 257 480 L 257 525 L 15 525 L 15 58 L 40 58" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="290" y="521" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">继续</text>
<text x="360" y="572" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">工具调用被拒绝或执行失败时，也要记录明确结果。</text>
<text x="360" y="604" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">是否重试、等待或转人工，由错误类型和运行规则决定。</text>
</svg>
