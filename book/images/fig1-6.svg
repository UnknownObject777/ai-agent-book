<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="146.67mm" viewBox="0 0 900 880" role="img" aria-labelledby="title desc">
<title id="title">自主 Agent 的执行循环</title><desc id="desc">保留推理、行动、观测与全部退出条件；任务完成经验证交付，错误或预算超限保存进度并报告。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="880" fill="#ffffff"/>
<rect x="190" y="30" width="360" height="105" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="370" y="65" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">检查运行预算与错误状态</text>
<text x="370" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">最大轮数 · 错误次数</text>
<text x="370" y="130" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">不可恢复错误</text>
<rect x="630" y="30" width="240" height="105" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="750" y="65" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">停止运行</text>
<text x="750" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">保存进度</text>
<text x="750" y="130" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">报告未完成部分／转人工</text>
<path d="M 550 80 L 630 80" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="590" y="65" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">需停止</text>
<path d="M 370 135 L 370 205" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440" y="176" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">可继续</text>
<rect x="190" y="205" width="360" height="110" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="370" y="241" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">推理与决策（Reasoning）</text>
<text x="370" y="281" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">“还需更多信息”／准备回答</text>
<path d="M 275 315 L 275 385" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="320" y="359" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">工具请求</text>
<rect x="90" y="385" width="370" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="275" y="426" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">行动（Acting）</text>
<text x="275" y="463" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">web_search(...)</text>
<text x="275" y="493" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">Harness 校验并调度执行</text>
<path d="M 275 505 L 275 580" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90" y="580" width="370" height="125" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="275" y="620" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">观测（Observation）</text>
<text x="275" y="660" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">tool_result: &quot;...&quot;</text>
<text x="275" y="690" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">结果或错误追加到上下文</text>
<path d="M 90 642 L 35 642 L 35 80 L 190 80" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 550 260 L 570 260 L 570 360 L 680 360 L 680 385" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="705" y="306" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">final_answer 或</text>
<text x="705" y="336" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">不含工具调用的回复</text>
<rect x="520" y="385" width="320" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="680" y="426" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">验证完成条件</text>
<text x="680" y="468" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">任务结果 · 必要产物</text>
<path d="M 680 505 L 680 580" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="727" y="550" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">通过</text>
<rect x="520" y="580" width="320" height="85" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="680" y="631" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">交付最终结果</text>
<path d="M 840 445 L 875 445 L 875 790 L 370 790 L 370 705" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="670" y="775" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">未通过：反馈差距，继续执行</text>
</svg>
