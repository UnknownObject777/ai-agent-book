<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="165.00mm" viewBox="0 0 900 990" role="img" aria-labelledby="title desc">
<title id="title">Manager 顺序协调</title><desc id="desc">Manager 分别调用收集、分析和写作成员，并接收其结果。</desc>
