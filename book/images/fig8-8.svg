<text x="450.0" y="430" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">前缀“……真实环境” → 目标“中”</text>
