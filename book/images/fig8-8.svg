<text x="225.0" y="245" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">Agent / 需要 / 在 / 真实 / 环境</text>
<text x="225.0" y="277" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">按实际 tokenizer 划分</text>
