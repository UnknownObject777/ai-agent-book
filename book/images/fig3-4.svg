<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="135.42mm" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
<title id="title">多类型记忆协同的参考架构</title>
<desc id="desc">长期记忆经选择进入当前任务，新增执行记录经提取与检查回到长期存储。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="650" fill="#ffffff"/>
<rect x="10" y="10" width="700" height="155" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="20" y="25" width="200" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="120.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">事件</text>
<text x="120.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">行程与处理经历</text>
<path d="M 120 115 L 120 155 L 360 155" fill="none" stroke="#292929" stroke-width="1.8"/>
<rect x="260" y="25" width="200" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">事实</text>
<text x="360.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">偏好与有效状态</text>
<path d="M 360 115 L 360 155 L 360 155" fill="none" stroke="#292929" stroke-width="1.8"/>
<rect x="500" y="25" width="200" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="600.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">方法</text>
<text x="600.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">流程与使用条件</text>
<path d="M 600 115 L 600 155 L 360 155" fill="none" stroke="#292929" stroke-width="1.8"/>
<path d="M 360 155 L 360 195" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="155" y="200" width="410" height="85" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="230" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">按当前问题检索</text>
<text x="360.0" y="261" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">身份、时间、对象与主题</text>
<path d="M 360 285 L 360 325" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="155" y="330" width="410" height="90" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="360" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">组织当前上下文</text>
<text x="360.0" y="391" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">相关记忆 + 新观测 + 任务状态</text>
<path d="M 360 420 L 360 460" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="155" y="465" width="410" height="80" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="495" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">任务推进，形成新记录</text>
<text x="360.0" y="526" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">模型决策，工具执行并返回结果</text>
<path d="M 565 505 L 675 505 L 675 580 L 535 580" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="185" y="555" width="350" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="593.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">提取候选记忆，检查后更新</text>
<path d="M 185 587 L 55 587 L 55 165" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="77" y="387" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">更</text>
<text x="77" y="412" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">新</text>
<text x="77" y="437" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">相</text>
<text x="77" y="462" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">应</text>
<text x="77" y="487" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">存</text>
<text x="77" y="512" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">储</text>
</svg>
