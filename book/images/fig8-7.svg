<text x="225.0" y="164" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">ε-贪婪查表 → 动作编号</text>
