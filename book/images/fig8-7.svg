<text x="450.0" y="520" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">位置 · 物品 · 门 · 守卫 → 执行动作 → 观测与奖励</text>
