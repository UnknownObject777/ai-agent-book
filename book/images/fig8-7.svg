<text x="450.0" y="920" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">北门上锁 → 寻找钥匙 → 拾取红钥匙与魔法水晶</text>
