<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="113.54mm" viewBox="0 0 720 545" role="img" aria-labelledby="title desc">
<title id="title">Skills 在任务历史中的加载顺序</title>
<desc id="desc">每个步骤给出本轮新增的信息，之前的相关消息继续保留。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="545" fill="#ffffff"/>
<rect x="25" y="25" width="175" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="112.5" y="61.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">任务开始</text>
<rect x="255" y="25" width="440" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="475.0" y="61.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用户要求 + 可用 Skills 目录</text>
<path d="M 200 55 L 255 55" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 475 85 L 475 120" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25" y="120" width="175" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="112.5" y="156.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">选择能力</text>
<rect x="255" y="120" width="440" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="475.0" y="156.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型选择演示文稿 Skill</text>
<path d="M 200 150 L 255 150" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 475 180 L 475 215" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25" y="215" width="175" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="112.5" y="251.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">加载流程</text>
<rect x="255" y="215" width="440" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="475.0" y="251.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Harness 加入核心指令</text>
<path d="M 200 245 L 255 245" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 475 275 L 475 310" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25" y="310" width="175" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="112.5" y="346.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">执行任务</text>
<rect x="255" y="310" width="440" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="475.0" y="346.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">按需读取参考资料，执行工具</text>
<path d="M 200 340 L 255 340" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 475 370 L 475 405" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25" y="405" width="175" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="112.5" y="441.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">检查产物</text>
<rect x="255" y="405" width="440" height="60" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="475.0" y="441.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">加入页面预览与检查结果</text>
<path d="M 200 435 L 255 435" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="360" y="520" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">新信息随任务进入历史，为下一步决策提供依据。</text>
</svg>
