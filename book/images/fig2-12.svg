<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="150.00mm" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">启用 Skills 后 Agent Trajectory 的完整结构</title><desc id="desc">以模型自主激活PPTX为例，目录先可见，激活后正文进入会话，再读取论文与生成HTML。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="900" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="100" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">系统指令与工具定义</text>
<text x="450" y="94" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">system：助手规则    tools：Skill、Read、Bash、Write…</text>
<rect x="20" y="151" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="165" y="189" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">user</text>
<path d="M 305 161 L 305 203" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="593" y="189" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">帮我从论文 PDF 生成 PPT</text>
<path d="M 450 213 L 450 229" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="229" width="860" height="62" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="165" y="267" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">Harness 目录</text>
<path d="M 305 239 L 305 281" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="593" y="267" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">可用 Skills：pdf、pptx…</text>
<path d="M 450 291 L 450 307" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="307" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="165" y="345" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">assistant</text>
<path d="M 305 317 L 305 359" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="593" y="345" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">call_1 → Skill(skill=&quot;pptx&quot;)</text>
<path d="M 450 369 L 450 385" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="385" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="165" y="423" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">tool · call_1</text>
<path d="M 305 395 L 305 437" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="593" y="423" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">确认激活 PPTX Skill</text>
<path d="M 450 447 L 450 463" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="463" width="860" height="62" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="165" y="501" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">user · Harness 注入</text>
<path d="M 305 473 L 305 515" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="593" y="501" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">PPTX Skill 正文：流程、详细指南与脚本入口</text>
<path d="M 450 525 L 450 541" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="541" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="165" y="579" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">assistant</text>
<path d="M 305 551 L 305 593" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="593" y="579" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">call_2 → Read（论文 PDF）</text>
<path d="M 450 603 L 450 619" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="619" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="165" y="657" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">tool · call_2</text>
<path d="M 305 629 L 305 671" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="593" y="657" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">论文的文本与图表内容</text>
<path d="M 450 681 L 450 697" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="697" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="165" y="735" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">assistant</text>
<path d="M 305 707 L 305 749" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="593" y="735" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">call_3 → Write（演示文稿 HTML）</text>
<path d="M 450 759 L 450 775" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="775" width="860" height="62" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="165" y="813" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">tool · call_3</text>
<path d="M 305 785 L 305 827" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="593" y="813" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">写入结果：12,345 bytes</text>
<text x="450" y="884" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">… 后续工具交互 …</text>
</svg>
