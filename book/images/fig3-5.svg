<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="113.54mm" viewBox="0 0 720 545" role="img" aria-labelledby="title desc">
<title id="title">RAG 查询流程：检索、增强与生成</title>
<desc id="desc">退款问题经过检索，条款与来源进入上下文，模型据此说明流程。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="545" fill="#ffffff"/>
<rect x="30" y="25" width="300" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用户问题</text>
<text x="180.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">怎样申请退款？</text>
<rect x="390" y="25" width="300" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">知识库与索引</text>
<text x="540.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">条款、操作说明与版本</text>
<path d="M 180 115 L 180 165 L 360 165" fill="none" stroke="#292929" stroke-width="1.8"/>
<path d="M 540 115 L 540 165 L 360 165" fill="none" stroke="#292929" stroke-width="1.8"/>
<path d="M 360 165 L 360 205" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110" y="210" width="500" height="80" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="240" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">检索适用片段</text>
<text x="360.0" y="271" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">按产品、版本与访问权限选择</text>
<path d="M 360 290 L 360 330" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110" y="335" width="500" height="80" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="365" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">组织上下文</text>
<text x="360.0" y="396" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">用户问题 + 条款 + 操作说明 + 来源</text>
<path d="M 360 415 L 360 455" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110" y="460" width="500" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="498.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型说明申请条件与处理步骤</text>
</svg>
