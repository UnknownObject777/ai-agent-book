<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="94.79mm" viewBox="0 0 720 455" role="img" aria-labelledby="title desc">
<title id="title">Agent 能力更新的三条路径</title>
<desc id="desc">三条路径按更新对象区分，不表示能力高低或固定先后顺序。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="455" fill="#ffffff"/>
<rect x="25" y="25" width="210" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="130.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">上下文适应</text>
<text x="130.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">当前任务</text>
<path d="M 235 75 L 275 75" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280" y="25" width="415" height="100" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="487" y="62" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#292929">加入示例、观测和任务状态</text>
<text x="487" y="97" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">下一次调用据此调整行为</text>
<rect x="25" y="155" width="210" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="130.0" y="185" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">外部产物更新</text>
<text x="130.0" y="216" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">跨任务</text>
<path d="M 235 205 L 275 205" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280" y="155" width="415" height="100" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="487" y="192" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#292929">修改知识、指令、Skill 或程序</text>
<text x="487" y="227" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">后续任务加载新版本</text>
<rect x="25" y="285" width="210" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="130.0" y="315" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型参数更新</text>
<text x="130.0" y="346" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">训练与部署</text>
<path d="M 235 335 L 275 335" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280" y="285" width="415" height="100" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="487" y="322" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#292929">用筛选后的数据进行后训练</text>
<text x="487" y="357" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">部署并评估新的模型版本</text>
<text x="360" y="439" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">三条路径可以配合使用；更新结果都需要验证。</text>
</svg>
