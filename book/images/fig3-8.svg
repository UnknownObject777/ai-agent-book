<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="116.67mm" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">BM25 评分机制</title>
<desc id="desc">词项稀有程度、词频饱和与文档长度共同决定单词贡献，多词贡献相加得到文档分数。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="560" fill="#ffffff"/>
<rect x="155" y="20" width="410" height="65" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="58.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">查询分词：模型、蒸馏</text>
<path d="M 360 85 L 360 110" fill="none" stroke="#292929" stroke-width="1.8"/>
<path d="M 360 110 L 120 110 L 120 140" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 360 110 L 360 110 L 360 140" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 360 110 L 600 110 L 600 140" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="140" width="200" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="120.0" y="170" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">稀有程度</text>
<text x="120.0" y="201" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">多少文档包含该词</text>
<path d="M 120 230 L 120 265 L 360 265" fill="none" stroke="#292929" stroke-width="1.8"/>
<rect x="260" y="140" width="200" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="170" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">词频</text>
<text x="360.0" y="201" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">该词出现多少次</text>
<path d="M 360 230 L 360 265 L 360 265" fill="none" stroke="#292929" stroke-width="1.8"/>
<rect x="500" y="140" width="200" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="600.0" y="170" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">文档长度</text>
<text x="600.0" y="201" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">相对于平均长度</text>
<path d="M 600 230 L 600 265 L 360 265" fill="none" stroke="#292929" stroke-width="1.8"/>
<path d="M 360 265 L 360 305" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90" y="310" width="540" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="340" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">逐词计算贡献</text>
<text x="360.0" y="371" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">稀有程度 × 经过饱和与长度调整的词频</text>
<path d="M 360 400 L 360 440" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="155" y="445" width="410" height="65" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="483.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">各查询词贡献相加 → 文档分数</text>
<text x="360" y="545" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">保持分词、IDF 写法与参数一致，再比较得分。</text>
</svg>
