<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="98.33mm" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">BM25 评分机制</title><desc id="desc">查询词贡献相加；每项结合逆文档频率、词频饱和和长度归一化。数值例子与正文十篇文档的语料一致。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="590" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="160" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="60" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#292929">Score(Q, D) = Σ IDF(qᵢ) ×</text>
<text x="490" y="105" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#292929">TF(qᵢ, D) × (k₁ + 1)</text>
<path d="M 180 120 L 800 120" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="490" y="156" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#292929">TF(qᵢ, D) + k₁ × (1 − b + b × |D| / avgdl)</text>
<path d="M 155 180 L 155 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="220" width="270" height="340" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="155" y="263" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">词频饱和</text>
<text x="155" y="318" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">k₁ 控制饱和程度</text>
<text x="155" y="349" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">文档长度固定时：</text>
<text x="155" y="380" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">词频增加，贡献增加</text>
<text x="155" y="411" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">每次增加的收益递减</text>
<path d="M 450 180 L 450 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="315" y="220" width="270" height="340" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="263" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">逆文档频率</text>
<text x="450" y="318" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">N = 10</text>
<text x="450" y="349" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">“模型”：DF = 3</text>
<text x="450" y="380" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">IDF ≈ 0.762</text>
<text x="450" y="411" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">“蒸馏”：DF = 2</text>
<text x="450" y="442" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">IDF ≈ 1.224</text>
<path d="M 745 180 L 745 220" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610" y="220" width="270" height="340" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="745" y="263" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">长度归一化</text>
<text x="745" y="318" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">b ∈ [0, 1]</text>
<text x="745" y="349" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">b = 0：关闭校正</text>
<text x="745" y="380" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">b = 1：完全校正</text>
<text x="745" y="411" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">相同词频、b &gt; 0 时</text>
<text x="745" y="442" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">长文档的贡献较低</text>
</svg>
