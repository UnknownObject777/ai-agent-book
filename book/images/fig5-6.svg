<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="168.33mm" viewBox="0 0 900 1010" role="img" aria-labelledby="title desc">
<title id="title">论文到讲解视频的端到端流水线</title><desc id="desc">PPT 生成审核与逐页讲解、音画合成两阶段。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="1010" fill="#ffffff"/>
<rect x="100" y="20" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="100" y="20" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">① 论文解析与内容规划</text>
<text x="450.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">提取章节、贡献与图表引用</text>
<text x="450.0" y="132" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">规划页面，为论点分配图表</text>
<path d="M 450 175 L 450 215" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100" y="215" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="100" y="215" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="248" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">② Slidev 生成与审核</text>
<text x="450.0" y="295" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">代码、文字与图表混排</text>
<text x="450.0" y="327" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">逐页渲染 → 视觉审核 → 修改</text>
<path d="M 450 370 L 450 410" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100" y="410" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="100" y="410" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="443" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">③ 逐页截图与讲解稿</text>
<text x="450.0" y="490" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">保留页面顺序与图表对应</text>
<text x="450.0" y="522" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">为每页生成口语化讲解</text>
<path d="M 450 565 L 450 605" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100" y="605" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="100" y="605" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="638" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">④ TTS 与音画同步</text>
<text x="450.0" y="685" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">逐页合成语音，读取音频时长</text>
<text x="450.0" y="717" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">设置对应截图时长，检查转场</text>
<path d="M 450 760 L 450 800" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100" y="800" width="700" height="155" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="100" y="800" width="700" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="833" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">⑤ 视频合成与检查</text>
<text x="450.0" y="880" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">FFmpeg 合成音轨与画面</text>
<text x="450.0" y="912" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">检查图文、讲解内容与音画同步</text>
</svg>
