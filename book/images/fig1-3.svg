<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="117.71mm" viewBox="0 0 720 565" role="img" aria-labelledby="title desc">
<title id="title">上下文消融实验</title>
<desc id="desc">Kimi K3 于 2026 年 8 月 25 日的五组运行。历史消息消融也移除此前的推理和工具结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="565" fill="#ffffff"/>
<rect x="25" y="20" width="670" height="75" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="50" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">固定系统提示词、当前任务和工具实现</text>
<text x="360.0" y="81" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">同一四币种收入任务；每组最多运行 5 轮</text>
<text x="190" y="132" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">输入条件</text>
<text x="510" y="132" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">这次运行的结果</text>
<rect x="25" y="153" width="275" height="52" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="162" y="185" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">完整上下文</text>
<path d="M 300 179 L 332 179" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="337" y="153" width="358" height="52" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="516" y="185" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">正确完成</text>
<rect x="25" y="220" width="275" height="52" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="162" y="252" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">不提供工具定义</text>
<path d="M 300 246 L 332 246" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="337" y="220" width="358" height="52" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="516" y="252" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">未调用工具；说明没有换汇工具</text>
<rect x="25" y="287" width="275" height="52" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="162" y="319" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">工具结果内容置空</text>
<path d="M 300 313 L 332 313" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="337" y="287" width="358" height="52" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="516" y="319" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">重复调用，达到轮数上限</text>
<rect x="25" y="354" width="275" height="52" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="162" y="386" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">不保留历史推理信息</text>
<path d="M 300 380 L 332 380" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="337" y="354" width="358" height="52" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="516" y="386" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">正确完成</text>
<rect x="25" y="421" width="275" height="52" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="162" y="453" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">不保留历史消息</text>
<path d="M 300 447 L 332 447" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="337" y="421" width="358" height="52" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="516" y="453" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">重复调用，达到轮数上限</text>
<text x="360" y="521" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">“不保留历史”同时移除此前的模型回复、调用与结果。</text>
<text x="360" y="548" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">工具定义提供选项，结果提供事实，历史保存进度。</text>
</svg>
