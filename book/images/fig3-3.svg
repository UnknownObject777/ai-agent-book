<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="131.25mm" viewBox="0 0 720 630" role="img" aria-labelledby="title desc">
<title id="title">Mem0 记忆管理架构</title>
<desc id="desc">对比旧流程写入时更新事实与新流程追加事实后检索的分工。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="630" fill="#ffffff"/>
<text x="185" y="30" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">论文中的更新流程</text>
<text x="535" y="30" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">新版开源追加流程</text>
<rect x="30" y="65" width="310" height="95" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="185.0" y="95" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">提取候选事实</text>
<text x="185.0" y="126" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">用户说明搬到上海</text>
<path d="M 185 160 L 185 193" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="193" width="310" height="95" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="185.0" y="223" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">检索相近记忆</text>
<text x="185.0" y="254" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">找到此前居住地</text>
<path d="M 185 288 L 185 321" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="321" width="310" height="95" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="185.0" y="351" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">决定怎样更新</text>
<text x="185.0" y="382" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">新增、修改、删除或保留</text>
<path d="M 185 416 L 185 449" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="449" width="310" height="95" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="185.0" y="479" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">读取整理后的事实</text>
<text x="185.0" y="510" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">当前居住地：上海</text>
<rect x="380" y="65" width="310" height="95" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="535.0" y="95" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">提取新增事实</text>
<text x="535.0" y="126" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">参考已有记忆去重</text>
<path d="M 535 160 L 535 193" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380" y="193" width="310" height="95" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="535.0" y="223" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">追加保存</text>
<text x="535.0" y="254" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">北京、搬到上海的记录并存</text>
<path d="M 535 288 L 535 321" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380" y="321" width="310" height="95" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="535.0" y="351" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">混合检索</text>
<text x="535.0" y="382" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">语义、关键词与实体匹配</text>
<path d="M 535 416 L 535 449" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380" y="449" width="310" height="95" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="535.0" y="479" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">结合时间与情境使用</text>
<text x="535.0" y="510" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">判断当前适用信息</text>
<text x="360" y="589" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">事实变化需要在写入、检索与使用过程中得到处理。</text>
</svg>
