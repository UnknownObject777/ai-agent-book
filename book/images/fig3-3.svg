<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="141.67mm" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">Mem0 记忆管理架构</title><desc id="desc">v2 在写入时比较和更新事实；v3 追加事实，在检索时结合语义、关键词、实体与时间背景。</desc>
