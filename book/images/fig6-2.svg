<text x="675.0" y="130" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">新事件</text>
<text x="675.0" y="177" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">user.interrupt：停止！</text>
<rect x="470" y="202" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="470" y="202" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
