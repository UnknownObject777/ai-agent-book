<text x="225.0" y="177" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">LLM 推理 / 工具执行</text>
<rect x="470" y="97" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
