<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="165.00mm" viewBox="0 0 900 990" role="img" aria-labelledby="title desc">
<title id="title">异步事件处理的三种策略</title><desc id="desc">取消、排队、并行中的任务状态与事件处理。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="990" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="52" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="55" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">取消式 · 停止当前任务</text>
<rect x="20" y="97" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
