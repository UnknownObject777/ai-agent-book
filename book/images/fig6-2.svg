<text x="675.0" y="607" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">tool.result 与补充一起接入</text>
<rect x="20" y="527" width="410" height="90" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
