<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="130.00mm" viewBox="0 0 900 780" role="img" aria-labelledby="title desc">
<title id="title">四种记忆策略对比</title><desc id="desc">四种记忆格式保留不同粒度的事实、背景、字段与关系。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="780" fill="#ffffff"/>
<rect x="20" y="20" width="410" height="350" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="20" width="410" height="62" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="225" y="60" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">Simple Notes</text>
<text x="225" y="123" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">用户邮箱：john@example.com</text>
<text x="225" y="154" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">公司：TechCorp</text>
<text x="225" y="185" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">职位：高级工程师</text>
<path d="M 40 266 L 410 266" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="225" y="303" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">按键定位平均 O(1)</text>
<text x="225" y="333" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">关联需要标识或检索补充</text>
<rect x="470" y="20" width="410" height="350" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="470" y="20" width="410" height="62" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="60" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">Enhanced Notes</text>
<text x="675" y="123" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">在 TechCorp 任高级工程师，</text>
<text x="675" y="154" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">带领 5 人团队</text>
<text x="675" y="185" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">开发推荐系统。</text>
<path d="M 490 266 L 860 266" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="303" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">段落保存事件背景</text>
<text x="675" y="333" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">重复内容需协调更新</text>
<rect x="20" y="410" width="410" height="350" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="410" width="410" height="62" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="225" y="450" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">JSON Cards</text>
<text x="225" y="513" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">work.company.name</text>
<text x="225" y="544" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">  = &quot;TechCorp&quot;</text>
<text x="225" y="575" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">work.position.title</text>
<text x="225" y="606" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">  = &quot;高级工程师&quot;</text>
<path d="M 40 656 L 410 656" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="225" y="693" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">类别 → 子类别 → 字段</text>
<text x="225" y="723" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">支持局部更新 · 需设计分类</text>
<rect x="470" y="410" width="410" height="350" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="470" y="410" width="410" height="62" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="450" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">Advanced JSON Cards</text>
<text x="675" y="513" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">person：用户父亲</text>
<text x="675" y="544" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">relationship：父亲</text>
<text x="675" y="575" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">backstory：心脏科就诊</text>
<text x="675" y="606" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">时间：2025-03-15</text>
<path d="M 490 656 L 860 656" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="675" y="693" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">来源 · 主体 · 关系 · 时间</text>
<text x="675" y="723" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">消歧依据更完整 · 维护增加</text>
