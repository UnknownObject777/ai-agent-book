<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="121.67mm" viewBox="0 0 900 730" role="img" aria-labelledby="title desc">
<title id="title">Agent 与 Environment 的闭环交互，以及 Agent 内部的 Model–Harness 结构</title><desc id="desc">Agent 包含并列的 Model 与 Harness。Harness 组织上下文、调度工具并管理运行；环境接收行动、更新状态并返回观测。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
