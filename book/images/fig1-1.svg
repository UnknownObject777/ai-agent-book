<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="120.83mm" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
<title id="title">Agent、Model、Harness 与环境</title>
<desc id="desc">Model 与 Harness 同属 Agent，二者不互相包含。环境在 Agent 外，通过工具接口交互。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="580" fill="#ffffff"/>
<rect x="20" y="20" width="455" height="540" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="247" y="53" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#292929">Agent</text>
<rect x="55" y="75" width="385" height="85" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="247.5" y="105" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Model（LLM）</text>
<text x="247.5" y="136" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">理解、规划和决策</text>
<rect x="55" y="230" width="385" height="300" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="247" y="265" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#292929">Harness</text>
<rect x="80" y="287" width="335" height="55" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="247.5" y="320.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">上下文管理</text>
<rect x="80" y="358" width="335" height="55" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="247.5" y="391.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">工具接口与调用调度</text>
<text x="247" y="455" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">运行循环与状态管理</text>
<text x="247" y="495" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#292929">约束 · 验证 · 纠正</text>
<path d="M 140 230 L 140 160" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="133" y="196" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#292929">上下文</text>
<path d="M 355 160 L 355 230" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="362" y="196" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">决策</text>
<rect x="535" y="270" width="165" height="210" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="617.5" y="300" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">环境</text>
<text x="617.5" y="331" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">文件与数据库</text>
<text x="617.5" y="356" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">网页与外部服务</text>
<text x="617.5" y="381" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">用户、其他 Agent</text>
<text x="617.5" y="406" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">物理或仿真世界</text>
<path d="M 535 315 L 440 315" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="505" y="298" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">观测</text>
<path d="M 440 386 L 535 386" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="505" y="371" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">行动</text>
</svg>
