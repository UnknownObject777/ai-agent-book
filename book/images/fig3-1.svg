<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="115.62mm" viewBox="0 0 720 555" role="img" aria-labelledby="title desc">
<title id="title">本章知识脉络</title>
<desc id="desc">用户记忆与知识库按身份和权限检索，经 Harness 选择后进入当前上下文；来源、时间与更新贯穿整个流程。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="555" fill="#ffffff"/>
<rect x="30" y="25" width="300" height="110" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用户记忆</text>
<text x="180.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">偏好、事实与交互经验</text>
<text x="180.0" y="111" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">按用户和相关对象组织</text>
<rect x="390" y="25" width="300" height="110" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">知识库</text>
<text x="540.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">规则、文档与项目资料</text>
<text x="540.0" y="111" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">按主题和版本组织</text>
<path d="M 180 135 L 180 180 L 360 180" fill="none" stroke="#292929" stroke-width="1.8"/>
<path d="M 540 135 L 540 180 L 360 180" fill="none" stroke="#292929" stroke-width="1.8"/>
<path d="M 360 180 L 360 220" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90" y="225" width="540" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="255" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">按当前任务检索</text>
<text x="360.0" y="286" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">身份与权限限定范围，索引帮助定位</text>
<path d="M 360 315 L 360 355" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90" y="360" width="540" height="90" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="390" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Harness 组织当前上下文</text>
<text x="360.0" y="421" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">相关记忆与资料 → 模型作出决策</text>
<text x="360" y="500" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">来源支持追溯，时间与版本支持更新。</text>
<text x="360" y="533" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">用后续任务检查：信息是否保存下来，是否正确使用。</text>
</svg>
