<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="154.17mm" viewBox="0 0 900 925" role="img" aria-labelledby="title desc">
<title id="title">分辨率匹配与双向坐标缩放</title><desc id="desc">截图缩放、坐标逆映射与偏移参数。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="925" fill="#ffffff"/>
<rect x="20" y="20" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="225.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">实际屏幕</text>
<text x="225.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">2560 × 1440</text>
<text x="225.0" y="132" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">桌面坐标原点与显示缩放</text>
<rect x="470" y="20" width="410" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="470" y="20" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">工具输出截图</text>
<text x="675.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">1366 × 768</text>
<text x="675.0" y="132" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">模型预测点：(683, 384)</text>
<path d="M 430 90 L 470 90" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="205" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="205" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="238" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">分别按宽、高映射</text>
<text x="450.0" y="285" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">x = 683 × 2560 / 1366 = 1280</text>
<text x="450.0" y="317" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">y = 384 × 1440 / 768 = 720</text>
<path d="M 450 350 L 450 390" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="390" width="860" height="140" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="390" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="423" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">执行与验证</text>
<text x="450.0" y="470" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">将桌面点 (1280, 720) 交给执行器</text>
<text x="450.0" y="502" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">点击 → 界面更新 → 新截图</text>
<rect x="20" y="570" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="570" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="603" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">参考目标尺寸</text>
<text x="450.0" y="650" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">XGA：1024 × 768 · WXGA：1280 × 800</text>
<text x="450.0" y="682" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">FWXGA：1366 × 768</text>
<rect x="20" y="755" width="860" height="145" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="755" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="788" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">等比缩放与留白时的逆变换</text>
<text x="450.0" y="835" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">先减填充偏移，再除缩放系数</text>
<text x="450.0" y="867" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">裁剪与多显示器：继续加回对应原点偏移</text>
</svg>
