<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="147.50mm" viewBox="0 0 900 885" role="img" aria-labelledby="title desc">
<title id="title">上下文窗口的构成概览</title><desc id="desc">北京天气示例：系统指令、天气工具定义、带调用ID的历史、当前推理和回答生成位置。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="885" fill="#ffffff"/>
<rect x="20" y="20" width="795" height="825" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="35" y="35" width="765" height="120" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="417" y="68" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">系统提示词（System Prompt）</text>
<text x="417" y="107" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">You are a helpful assistant. Answer concisely.</text>
<text x="417" y="141" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">Use tools for real-time information.</text>
<rect x="35" y="170" width="765" height="205" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="417" y="203" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">工具定义（Tool Definitions）</text>
<text x="417" y="242" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">{&quot;name&quot;: &quot;get_weather&quot;, &quot;description&quot;: &quot;查询城市天气&quot;,</text>
<text x="417" y="276" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929"> &quot;parameters&quot;: {&quot;type&quot;: &quot;object&quot;, &quot;properties&quot;: {</text>
<text x="417" y="310" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">   &quot;city&quot;: {&quot;type&quot;: &quot;string&quot;}}, &quot;required&quot;: [&quot;city&quot;]}}</text>
<rect x="35" y="390" width="765" height="220" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="417" y="423" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">对话历史（Conversation History）</text>
<text x="417" y="462" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">user：北京今天天气怎么样？</text>
<text x="417" y="496" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">assistant：call_1 → get_weather(city=&quot;北京&quot;)</text>
<text x="417" y="530" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">tool（call_1）：{&quot;temp&quot;: &quot;23°C&quot;, &quot;conditions&quot;: &quot;晴&quot;}</text>
<rect x="35" y="625" width="765" height="125" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="417" y="658" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">本轮推理（Reasoning）</text>
<text x="417" y="697" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">&lt;think&gt;已获得北京天气，接下来汇总回答。&lt;/think&gt;</text>
<rect x="35" y="765" width="765" height="65" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="417" y="805" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">assistant：北京今天晴，气温 23°C…</text>
<path d="M 835 35 L 855 35 L 855 750 L 835 750" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="879" y="335" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">上</text>
<text x="879" y="370" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">下</text>
<text x="879" y="405" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">文</text>
<text x="879" y="440" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">窗</text>
<text x="879" y="475" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">口</text>
<text x="450" y="872" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">当前生成位置</text>
<path d="M 450 850 L 450 831" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
