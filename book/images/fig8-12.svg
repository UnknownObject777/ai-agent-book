<text x="450.0" y="720" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">规则 GP-L：SFT −8.1；RL +3.5</text>
<text x="450.0" y="752" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">规则 GP-VL：SFT −5.6；RL +3.0</text>
