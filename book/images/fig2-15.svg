<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="116.67mm" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">最新状态的上下文位置</title>
<desc id="desc">规则、相关历史和最新状态组成一次请求，末尾状态由 Harness 生成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="560" fill="#ffffff"/>
<rect x="55" y="25" width="610" height="70" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="66.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">稳定规则与工具定义</text>
<rect x="55" y="120" width="610" height="110" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="150" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">任务历史</text>
<text x="360.0" y="181" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">用户要求、模型请求、通话与搜索结果</text>
<rect x="55" y="255" width="610" height="120" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="285" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">Harness 生成的最新状态</text>
<text x="360.0" y="316" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">已拨打三次，达到上限</text>
<text x="360.0" y="341" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">退款仍在处理；下一步核实到账</text>
<path d="M 360 375 L 360 425" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="175" y="430" width="370" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="468.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型基于本轮上下文继续决策</text>
<text x="360" y="537" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">状态注明来源与更新时间，随任务推进更新。</text>
</svg>
