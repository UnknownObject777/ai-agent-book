<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="128.33mm" viewBox="0 0 900 770" role="img" aria-labelledby="title desc">
<title id="title">Agent 状态栏在 API 消息列表中的插入位置</title><desc id="desc">取消Xfinity套餐示例：原始交互与用户追问后，Harness追加当前状态摘要。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="770" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="95" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="54" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#292929">系统指令与工具定义</text>
<text x="450" y="93" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">system：客服规则    tools：phone_call、web_search…</text>
<rect x="20" y="139" width="860" height="56" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="135" y="174" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">user</text>
<text x="563" y="174" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">帮我取消 Xfinity 套餐</text>
<rect x="20" y="207" width="860" height="56" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="135" y="242" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">assistant</text>
<text x="563" y="242" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">call_1 → phone_call(company=&quot;Xfinity&quot;)</text>
<rect x="20" y="275" width="860" height="56" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="135" y="310" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">tool · call_1</text>
<text x="563" y="310" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">通话记录：套餐仍在合约期内</text>
<rect x="20" y="343" width="860" height="56" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="135" y="378" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">assistant</text>
<text x="563" y="378" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">说明合约条件与下一步安排</text>
<rect x="20" y="411" width="860" height="56" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="135" y="446" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">…</text>
<text x="563" y="446" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">后续电话与搜索交互</text>
<rect x="20" y="479" width="860" height="56" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="135" y="514" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" fill="#292929">user</text>
<text x="563" y="514" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">能不能再打一次催一下？</text>
<path d="M 450 535 L 450 566" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="566" width="860" height="140" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="599" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">user · Harness 生成的状态摘要</text>
<text x="450" y="637" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">&lt;agent_status&gt; Xfinity 已呼叫 3/3 次</text>
<text x="450" y="677" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">TODO：取消套餐（in_progress） &lt;/agent_status&gt;</text>
<path d="M 450 706 L 450 738" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="762" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">模型继续生成</text>
</svg>
