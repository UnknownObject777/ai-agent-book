<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="122.92mm" viewBox="0 0 720 590" role="img" aria-labelledby="title desc">
<title id="title">固定检索流程与智能体 RAG</title>
<desc id="desc">左侧流程由程序预定；右侧模型根据检索观测继续查询或作答，循环受预算约束。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="590" fill="#ffffff"/>
<text x="175" y="35" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">固定检索流程</text>
<text x="535" y="35" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">智能体 RAG</text>
<rect x="45" y="65" width="260" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="175.0" y="101.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用户问题</text>
<path d="M 175 125 L 175 165" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="405" y="65" width="260" height="60" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="535.0" y="101.0" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用户问题</text>
<path d="M 535 125 L 535 165" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45" y="170" width="260" height="110" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="175.0" y="200" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">按预定步骤检索</text>
<text x="175.0" y="231" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">可含查询改写、融合与重排</text>
<path d="M 175 280 L 175 330" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45" y="335" width="260" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="175.0" y="373.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">组织检索材料</text>
<path d="M 175 400 L 175 445" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45" y="450" width="260" height="65" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="175.0" y="488.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">生成回答</text>
<rect x="405" y="170" width="260" height="90" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="535.0" y="200" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型决定下一步</text>
<text x="535.0" y="231" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">查询、读取或作答</text>
<path d="M 460 260 L 460 310" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480" y="292" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">继续查询</text>
<rect x="405" y="315" width="260" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="535.0" y="353.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">工具检索，返回观测</text>
<path d="M 665 348 L 695 348 L 695 215 L 665 215" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 405 215 L 365 215 L 365 482 L 405 482" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="386" y="425" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">作答</text>
<rect x="405" y="450" width="260" height="65" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="535.0" y="488.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">结合已有证据回答</text>
<text x="360" y="558" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">检索循环设置次数、时间或成本预算。</text>
</svg>
