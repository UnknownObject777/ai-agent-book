<text x="225.0" y="796" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">超时 · 缓存 · 版本检查</text>
<rect x="470" y="620" width="410" height="205" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="470" y="620" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
