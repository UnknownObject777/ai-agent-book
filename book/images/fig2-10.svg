<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="100.00mm" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Prompt Cache：跨请求复用前缀的 KV Cache</title><desc id="desc">三次请求对比：共同系统指令和工具定义可复用；在最前部插入时间戳改变后续前缀。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="600" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="160" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="96" y="55" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">请求 1</text>
<rect x="40" y="75" width="545" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="312" y="112" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">System Prompt + Tools</text>
<rect x="610" y="75" width="250" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="735" y="112" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">user：天气如何？</text>
<text x="312" y="165" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">首次处理（示例前缀：1200 token）</text>
<text x="735" y="165" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">→ 生成回答</text>
<rect x="20" y="210" width="860" height="160" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="96" y="245" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">请求 2</text>
<rect x="40" y="265" width="545" height="57" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="312" y="302" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">System Prompt + Tools</text>
<rect x="610" y="265" width="250" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="735" y="302" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">user：时间几点？</text>
<text x="312" y="355" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">复用共同前缀</text>
<text x="735" y="355" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">→ 生成回答</text>
<rect x="20" y="400" width="860" height="160" rx="6" fill="#f2f2f2" stroke="#333333" stroke-width="1.8"/>
<text x="96" y="435" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">请求 3</text>
<rect x="40" y="455" width="545" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="312" y="492" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">10:30:45 + System Prompt + Tools</text>
<rect x="610" y="455" width="250" height="57" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="735" y="492" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">user：天气如何？</text>
<text x="312" y="545" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">前缀改变，重新处理</text>
<text x="735" y="545" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">→ 生成回答</text>
<path d="M 312 180 L 312 210" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 312 370 L 312 400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
