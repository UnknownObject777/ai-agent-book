<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="166.67mm" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
<title id="title">SQL 查询 Agent 流程</title><desc id="desc">受控执行服务连接数据库与界面，模型按需解释聚合结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="1000" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="110" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="20" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">用户问题</text>
<text x="450.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">每个部门有多少在职员工？</text>
<path d="M 450 130 L 450 170" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="170" width="860" height="180" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="170" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="203" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">Agent 生成 SQL Artifact</text>
<text x="450.0" y="250" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">SELECT department, COUNT(*) AS count</text>
<text x="450.0" y="282" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">FROM employees WHERE termination_date IS NULL</text>
<text x="450.0" y="314" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">GROUP BY department;</text>
<path d="M 450 350 L 450 395" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="395" width="860" height="150" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="395" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="428" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">受控执行服务</text>
<text x="450.0" y="475" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">可信身份 · 表 / 列 / 行权限 · 查询结构检查</text>
<text x="450.0" y="507" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">参数绑定 · 时间与行数预算 · 受限数据库连接</text>
<path d="M 450 545 L 450 565 L 225 565 L 225 585" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="585" width="410" height="190" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="585" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="225.0" y="618" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">数据库结果（示意）</text>
<text x="225.0" y="665" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">部门          在职人数</text>
<text x="225.0" y="697" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">研发部             42</text>
<text x="225.0" y="729" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">市场部             28</text>
<rect x="470" y="585" width="410" height="190" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="470" y="585" width="410" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="675.0" y="618" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">界面呈现</text>
<text x="675.0" y="665" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">直接渲染结果表格</text>
<text x="675.0" y="697" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">按同一结果生成柱状图</text>
<text x="675.0" y="729" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">保留筛选条件、单位与口径</text>
<path d="M 430 680 L 470 680" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="830" width="860" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="830" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="863" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">按需解释</text>
<text x="450.0" y="910" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">将必要的聚合结果交给模型，解释差异或回答后续问题</text>
<path d="M 225 775 L 225 805 L 450 805 L 450 830" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
