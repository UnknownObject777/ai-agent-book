<text x="450.0" y="480" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">知识 · 指令（Prompt / Skill）· 程序 · 参数</text>
<path d="M 450 530 L 450 590" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70" y="590" width="760" height="130" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="70" y="590" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="623" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">验证与发布</text>
<text x="450.0" y="670" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">独立任务 · 回归 · 灰度 · 监控 · 回滚</text>
<path d="M 830 655 L 865 655 L 865 790 L 35 790 L 35 85 L 70 85" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="762" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">新版本进入下一轮运行</text>
