<rect x="70" y="210" width="760" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="243" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">记录轨迹与形成信号</text>
<text x="450.0" y="290" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">动作 · 结果 · 反馈 → 结果、过程与质量评价</text>
<path d="M 450 340 L 450 400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
