<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="138.33mm" viewBox="0 0 900 830" role="img" aria-labelledby="title desc">
<title id="title">Agent 持续进化的总体闭环</title><desc id="desc">运行、评价、候选更新、验证与发布；更新接回下一轮运行。</desc>
