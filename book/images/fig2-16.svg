<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="120.83mm" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
<title id="title">上下文压缩与缓存边界</title>
<desc id="desc">稳定前缀可继续复用，旧历史形成摘要，从改动处开始重新处理。原始记录单独归档。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="580" fill="#ffffff"/>
<text x="180" y="32" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">压缩前</text>
<text x="540" y="32" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">压缩后</text>
<rect x="30" y="60" width="300" height="65" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="98.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">稳定规则与工具定义</text>
<rect x="390" y="60" width="300" height="65" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="98.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">稳定规则与工具定义</text>
<rect x="30" y="155" width="300" height="210" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="185" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">已完成阶段的历史</text>
<text x="180.0" y="216" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">搜索页面、工具结果</text>
<text x="180.0" y="241" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">中间判断与处理记录</text>
<rect x="390" y="155" width="300" height="105" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="185" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">阶段摘要</text>
<text x="540.0" y="216" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">结论、理由、来源与待办</text>
<path d="M 330 205 L 390 205" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30" y="395" width="300" height="75" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="438.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">当前步骤所需细节</text>
<rect x="390" y="290" width="300" height="75" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="333.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">当前步骤所需细节</text>
<path d="M 330 430 L 360 430 L 360 330 L 390 330" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="390" y="405" width="300" height="65" rx="6" fill="#ffffff" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="443.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">上下文外：原始记录归档</text>
<path d="M 330 330 L 345 330 L 345 490 L 540 490 L 540 470" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540" y="390" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">按来源回查原文</text>
<text x="360" y="529" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">灰色前缀保持一致，可按缓存条件复用。</text>
<text x="360" y="558" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">摘要改变历史，从首次改动位置开始重新处理。</text>
</svg>
