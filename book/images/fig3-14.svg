<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="136.46mm" viewBox="0 0 720 655" role="img" aria-labelledby="title desc">
<title id="title">为片段补充背景后建立索引</title>
<desc id="desc">教学示例：结合文档生成片段背景，保留原文与来源，再建立稀疏和稠密索引。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="655" fill="#ffffff"/>
<rect x="25" y="25" width="310" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">文档背景</text>
<text x="180.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">星河产品升级说明</text>
<text x="180.0" y="111" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">适用版本：2.0 升至 3.0</text>
<rect x="385" y="25" width="310" height="100" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="540.0" y="55" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">原始片段</text>
<text x="540.0" y="86" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">升级前需要先备份配置。</text>
<path d="M 180 125 L 180 155 L 300 155 L 300 190" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 540 125 L 540 155 L 420 155 L 420 190" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180" y="195" width="360" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="233.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">模型结合文档生成片段背景</text>
<path d="M 360 260 L 360 305" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="95" y="310" width="530" height="145" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360" y="340" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">用于建立索引的内容</text>
<text x="360" y="377" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">背景：星河产品从 2.0 升至 3.0 的准备要求。</text>
<text x="360" y="411" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#292929">原文：升级前需要先备份配置。</text>
<text x="360" y="438" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">保留来源，核对背景与原文的一致性。</text>
<path d="M 360 455 L 360 490 L 185 490 L 185 525" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55" y="530" width="260" height="65" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="185.0" y="568.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">BM25 索引</text>
<path d="M 360 455 L 360 490 L 535 490 L 535 525" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="405" y="530" width="260" height="65" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="535.0" y="568.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">稠密向量索引</text>
<text x="360" y="635" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">背景补入检索线索；原始片段保留具体要求。</text>
</svg>
