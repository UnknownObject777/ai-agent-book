<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="166.67mm" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
<title id="title">从已评价轨迹到经验知识文档</title><desc id="desc">原始证据、单次评价、跨轨迹比较、文档与检索反馈。</desc>
