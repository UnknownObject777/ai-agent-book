<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="151.67mm" viewBox="0 0 900 910" role="img" aria-labelledby="title desc">
<title id="title">MCP 协议交互时序</title><desc id="desc">MCP 2026-07-28：客户端可先发现服务器能力，再列举并调用天气工具。每次请求均携带所需协议元数据；图中展开业务方法与参数。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="910" fill="#ffffff"/>
<rect x="20" y="20" width="280" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="160" y="57" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#292929">MCP Client</text>
<text x="160" y="93" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">宿主内的协议客户端</text>
<rect x="600" y="20" width="280" height="90" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="740" y="57" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" fill="#292929">MCP Server</text>
<text x="740" y="93" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#292929">提供天气查询工具</text>
<path d="M160 110 L160 890" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M740 110 L740 890" fill="none" stroke="#777777" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="20" y="135" width="860" height="45" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="166" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">① 能力发现（客户端可选）</text>
<rect x="20" y="365" width="860" height="45" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="396" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">② 工具发现</text>
<rect x="20" y="635" width="860" height="45" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="666" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" fill="#292929">③ 工具调用</text>
<text x="450" y="220" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">server/discover</text>
<path d="M 160 235 L 740 235" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="295" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">支持的协议版本与服务器能力</text>
<path d="M 740 310 L 160 310" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="435" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">tools/list</text>
<path d="M 160 450 L 740 450" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="520" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">工具定义：get_weather</text>
<path d="M 740 535 L 160 535" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240" y="555" width="420" height="60" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="450" y="581" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">输入：城市（字符串）</text>
<text x="450" y="608" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">用途：查询指定城市天气</text>
<text x="450" y="705" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">tools/call：get_weather</text>
<path d="M 160 720 L 740 720" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450" y="754" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">arguments：{&quot;location&quot;: &quot;Beijing&quot;}</text>
<text x="450" y="835" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#292929">工具结果：Beijing，22°C，晴</text>
<path d="M 740 850 L 160 850" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
