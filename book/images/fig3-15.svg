<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="143.75mm" viewBox="0 0 720 690" role="img" aria-labelledby="title desc">
<title id="title">从案例抽取到样本模式分析</title>
<desc id="desc">案例按字段定义抽取，编码后聚类并汇总统计；留出案例匹配已有原型，检查解释与原文。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#292929"/></marker></defs>
<rect width="720" height="690" fill="#ffffff"/>
<rect x="35" y="25" width="290" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="63.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">建模案例</text>
<rect x="405" y="25" width="280" height="65" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="545.0" y="63.5" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">留出案例</text>
<path d="M 180 90 L 180 125" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35" y="130" width="290" height="85" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="160" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">发现并统一字段</text>
<text x="180.0" y="191" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">定义取值与证据要求</text>
<path d="M 180 215 L 180 250" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35" y="255" width="290" height="85" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="285" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">逐例抽取与核查</text>
<text x="180.0" y="316" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">保存原文关联与缺失状态</text>
<path d="M 325 173 L 365 173 L 365 297 L 405 297" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420" y="238" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#292929">沿用字段定义</text>
<path d="M 545 90 L 545 250" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="405" y="255" width="280" height="85" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="545.0" y="285" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">抽取留出案例</text>
<text x="545.0" y="316" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">核对字段与原文</text>
<path d="M 180 340 L 180 375" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35" y="380" width="290" height="85" rx="6" fill="#dedede" stroke="#292929" stroke-width="1.5"/>
<text x="180.0" y="410" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">编码、分组与汇总</text>
<text x="180.0" y="441" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">原型特征、成员与结果分布</text>
<path d="M 325 423 L 405 423" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 545 340 L 545 375" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="405" y="380" width="280" height="85" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="545.0" y="410" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">匹配已有原型</text>
<text x="545.0" y="441" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">比较共同点与差异</text>
<path d="M 545 465 L 545 505 L 360 505 L 360 540" fill="none" stroke="#292929" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="130" y="545" width="460" height="85" rx="6" fill="#f2f2f2" stroke="#292929" stroke-width="1.5"/>
<text x="360.0" y="575" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">检查解释，再用于检索与提问</text>
<text x="360.0" y="606" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">核对样本范围、统计值和来源</text>
<text x="360" y="672" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#292929">分组特征说明样本差异，结果分布描述组内记录。</text>
</svg>
