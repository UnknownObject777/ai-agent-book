<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="133.33mm" viewBox="0 0 900 800" role="img" aria-labelledby="title desc">
<title id="title">从环境结果到 LLM Rubric 的三层轨迹验证</title><desc id="desc">三类评价输入汇入包含结果、维度、证据与标签的诊断。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#333333"/></marker></defs>
<rect width="900" height="800" fill="#ffffff"/>
<rect x="20" y="20" width="270" height="160" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="20" width="270" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="155.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">结果验证器</text>
<text x="155.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">测试是否通过</text>
<text x="155.0" y="132" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">金额与订单状态</text>
<path d="M 155 180 L 155 210" fill="none" stroke="#333333" stroke-width="1.8"/>
<rect x="315" y="20" width="270" height="160" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="315" y="20" width="270" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">过程验证器</text>
<text x="450.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">政策与权限</text>
<text x="450.0" y="132" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">动作与承诺一致性</text>
<path d="M 450 180 L 450 210" fill="none" stroke="#333333" stroke-width="1.8"/>
<rect x="610" y="20" width="270" height="160" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="610" y="20" width="270" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="745.0" y="53" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">LLM Rubric</text>
<text x="745.0" y="100" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">自然与简洁</text>
<text x="745.0" y="132" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">合规变通</text>
<path d="M 745 180 L 745 210" fill="none" stroke="#333333" stroke-width="1.8"/>
<path d="M 155 210 L 745 210" fill="none" stroke="#333333" stroke-width="1.8"/>
<path d="M 450 210 L 450 250" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="250" width="860" height="240" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="250" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="283" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">结构化轨迹评价</text>
<text x="450.0" y="330" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">任务结果：成功 / 部分成功 / 失败</text>
<text x="450.0" y="362" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">维度评价：逐项评分；证据不足项标记为待核实</text>
<text x="450.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">证据位置：对话轮次、工具状态与对应结果</text>
<text x="450.0" y="426" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">失败标签：问题类型与适用条件</text>
<path d="M 450 490 L 450 535" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20" y="535" width="860" height="165" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="20" y="535" width="860" height="48" rx="6" fill="#dedede" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="568" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#292929">诊断与更新选择</text>
<text x="450.0" y="615" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">对照成功、失败位置与原始证据</text>
<text x="450.0" y="647" text-anchor="middle" font-family="Noto Sans CJK SC,Source Han Sans CN,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#292929">归纳问题类型 → 独立模块选择更新对象</text>
</svg>
